<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOL 프로토타입</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- 상단: 시간 / 점수 -->
<div id="topbar" class="hud hidden">
  <div class="team blue"><span class="lbl">파괴한 포탑</span><span id="blueTowers">0</span></div>
  <div id="timer">00:00</div>
  <div class="team red"><span id="redTowers">0</span><span class="lbl">잃은 포탑</span></div>
</div>
<div id="topright" class="hud hidden">
  <span id="csText">CS 0</span>
  <span id="fpsText">60 FPS</span>
</div>

<!-- 좌상단: 대상 정보 -->
<div id="targetFrame" class="hud hidden"></div>

<!-- 안내 메시지 -->
<div id="announce"></div>
<div id="buffBar" class="hud hidden"></div>

<!-- 하단 HUD -->
<div id="bottomHud" class="hud hidden">
  <div id="statsPanel"></div>
  <div id="portrait">
    <div id="portraitInner">⚔</div>
    <div id="levelBadge">1</div>
    <div id="xpRing"><div id="xpFill"></div></div>
  </div>
  <div id="centerPanel">
    <div id="abilityRow">
      <div id="abilitySlots"></div>
      <div class="spacer"></div>
      <div class="slot spell" id="spellD" title="회복 (D)"><span class="icon">✚</span><span class="key">D</span><div class="cd"></div></div>
      <div class="slot spell" id="spellF" title="점멸 (F)"><span class="icon">✦</span><span class="key">F</span><div class="cd"></div></div>
    </div>
    <div class="bar" id="hpBar"><div class="fill"></div><div class="shield"></div><div class="ticks"></div><span class="txt"></span></div>
    <div class="bar" id="resBar"><div class="fill"></div><span class="txt"></span></div>
  </div>
  <div id="rightPanel">
    <div id="items"></div>
    <div id="goldRow">
      <button id="shopBtn" title="상점 (P)">🛒</button>
      <span id="goldText">500</span>
      <button id="recallBtn" title="귀환 (B)">⌂</button>
    </div>
  </div>
</div>

<div id="minimapWrap" class="hud hidden"><canvas id="minimap"></canvas></div>

<!-- 사망 / 귀환 -->
<div id="deathOverlay" class="hidden"><div id="deathText"></div></div>
<div id="channelBar" class="hidden"><div class="fill"></div><span>귀환 중</span></div>

<!-- 상점 -->
<div id="shop" class="panel hidden">
  <div class="panelHead"><h2>상점</h2><span id="shopNote"></span><button class="close" data-close="shop">✕</button></div>
  <div id="shopList"></div>
  <div id="shopDetail"></div>
</div>

<div id="tooltip" class="hidden"></div>

<!-- 시작 화면 (챔피언 선택) -->
<div id="startScreen" class="screen">
  <div class="screenBox">
    <h1>LOL <small>프로토타입</small></h1>
    <p class="sub">3라인 · 정글 · 포탑 · 억제기 · 넥서스</p>
    <h3 class="selTitle">챔피언 선택</h3>
    <div id="champSelect"></div>
    <p><b class="blueTxt">블루 팀</b>으로 플레이합니다. 미니언과 함께 라인을 밀어 <b class="redTxt">적 넥서스</b>를 파괴하세요.</p>
    <div class="controls">
      <div><kbd>우클릭</kbd> 이동 / 공격</div>
      <div><kbd>A</kbd> + <kbd>좌클릭</kbd> 공격 이동</div>
      <div><kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd><kbd>R</kbd> 스킬 (마우스 위치로 바로 시전)</div>
      <div><kbd>Shift</kbd> + <kbd>Q</kbd>~<kbd>R</kbd> 스킬 레벨 올리기</div>
      <div><kbd>D</kbd> 회복 &nbsp; <kbd>F</kbd> 점멸</div>
      <div><kbd>B</kbd> 귀환 &nbsp; <kbd>P</kbd> 상점</div>
      <div><kbd>S</kbd> 정지 &nbsp; <kbd>1</kbd>~<kbd>6</kbd> 아이템</div>
      <div><kbd>Space</kbd> 카메라 중앙 &nbsp; <kbd>Y</kbd> 고정</div>
    </div>
    <button id="startBtn" class="bigBtn">게임 시작</button>
  </div>
</div>

<div id="pauseScreen" class="screen hidden">
  <div class="screenBox">
    <h1>일시정지</h1>
    <button id="resumeBtn" class="bigBtn">계속하기</button>
    <button id="restartBtn2" class="bigBtn ghost">처음부터</button>
    <button id="menuBtn2" class="bigBtn ghost">챔피언 선택</button>
  </div>
</div>

<div id="endScreen" class="screen hidden">
  <div class="screenBox">
    <h1 id="endTitle">승리</h1>
    <div id="endStats"></div>
    <button id="restartBtn" class="bigBtn">다시 하기</button>
    <button id="menuBtn" class="bigBtn ghost">챔피언 선택</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/map.js"></script>
<script src="js/items.js"></script>
<script src="js/entities.js"></script>
<script src="js/structures.js"></script>
<script src="js/hero.js"></script>
<script src="js/champions/orianna.js"></script>
<script src="js/game.js"></script>
<script src="js/input.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
